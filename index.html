<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Европа по номерам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: the teacher's map is the stage (left), a quiz desk sits beside it (right); stacks on phones */
:root {
  --bg: #e9eef1;
  --surface: #ffffff;
  --ink: #13202a;
  --muted: #5a6a75;
  --line: #d3dce1;
  --accent: #d97a1e;
  --accent-ink: #ffffff;
  --isl: #2f7fd1;
  --arch: #8657d6;
  --pen: #229069;
  --st: #c23b78;
  --good: #1d9a52;
  --bad: #d43f3f;
  --good-bg: #e3f5ea;
  --bad-bg: #fbe6e6;
  --chip: #eef2f5;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d151d; --surface: #15202b; --ink: #e5ecf1; --muted: #93a3af; --line: #26354300;
    --line: #263543; --accent: #f09a45; --accent-ink: #1a1006;
    --isl: #5ea3ec; --arch: #a983ee; --pen: #3fbf8f; --st: #ec6fa8; --good: #3cc477; --bad: #ef6464;
    --good-bg: #133222; --bad-bg: #3a1a1a; --chip: #1d2a37; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d151d; --surface: #15202b; --ink: #e5ecf1; --muted: #93a3af;
  --line: #263543; --accent: #f09a45; --accent-ink: #1a1006;
  --isl: #5ea3ec; --arch: #a983ee; --pen: #3fbf8f; --st: #ec6fa8; --good: #3cc477; --bad: #ef6464;
  --good-bg: #133222; --bad-bg: #3a1a1a; --chip: #1d2a37; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 32px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 3vw, 30px); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 small { display: block; font-family: var(--body); font-weight: 500; font-size: 14px; color: var(--muted); letter-spacing: 0; margin-top: 6px; }

.mapsw { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.mapsw button { font: 600 14px var(--body); padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.mapsw button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mapsw button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabs button { font: 600 14px var(--body); border: 0; background: transparent; color: var(--muted); padding: 9px 14px; border-radius: 9px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tabs button:hover:not([aria-pressed="true"]) { color: var(--ink); background: var(--chip); }

.app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 920px) {
  .app { grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); grid-template-areas: "stage panel" "prog panel"; }
  .stage { grid-area: stage; } .panel { grid-area: panel; } .progress { grid-area: prog; }
}

.stage { min-width: 0; }
.mapbox { position: relative; }
.mscroll { border-radius: 12px; overflow: hidden; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(0,0,0,.5); }
.mscroll.zoomed { overflow: auto; max-height: 72vh; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.mscroll.zoomed .map { width: 210%; max-width: none; }
.zoom { position: absolute; right: 8px; bottom: 8px; z-index: 4; font: 600 13px var(--body); padding: 7px 11px; border-radius: 8px; border: 0; background: rgba(10,16,24,.78); color: #fff; cursor: pointer; }
.zoom[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.map { position: relative; background: #1c2a5a; width: 100%; aspect-ratio: 843 / 730; touch-action: manipulation; }
.map img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.map.hide-nums .cover { opacity: 1; }

.marker { position: absolute; width: clamp(20px, 5.2%, 46px); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid transparent; background: transparent; padding: 0; cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s; }
.marker::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--c); opacity: .0; transition: opacity .15s; }
.map.interactive .marker::after { opacity: .85; }
.map.interactive .marker:hover { background: rgba(255,255,255,.18); }
.map:not(.interactive) .marker { cursor: default; }
.marker:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.marker.active { background: rgba(255,255,255,.22); }
.marker.active::after { opacity: 1; border-width: 3px; border-color: #fff; }
.marker.target::after { opacity: 1; border: 3px solid var(--accent); }
.marker.target::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--accent); animation: ping 1.3s ease-out infinite; }
.marker.good { background: rgba(29,154,82,.45); }
.marker.good::after { opacity: 1; border: 3px solid #3cdc85; }
.marker.bad { background: rgba(212,63,63,.45); }
.marker.bad::after { opacity: 1; border: 3px solid #ff7a7a; }
.marker.good::before, .marker.bad::before { display: none; }
@keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(2.1); opacity: 0; } }

.tag { position: absolute; transform: translate(-50%, calc(-100% - 22px)); background: rgba(10,16,24,.88); color: #fff; font: 600 13px var(--body); padding: 5px 9px; border-radius: 7px; white-space: nowrap; pointer-events: none; z-index: 3; }
.tag.good { background: #17803f; }
.tag.bad { background: #b83232; }
.tag::after { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 5px solid transparent; border-bottom: 0; border-top-color: inherit; }
.tag.dark::after { border-top-color: rgba(10,16,24,.88); }
.tag.good::after { border-top-color: #17803f; }
.tag.bad::after { border-top-color: #b83232; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c); display: inline-block; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: 500 13px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 10px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.settings { display: grid; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.settings summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; cursor: pointer; list-style: none; }
.settings summary::-webkit-details-marker { display: none; }
.settings summary::after { content: "▾"; margin-left: auto; color: var(--muted); }
.settings[open] summary { margin-bottom: 4px; }
.settings[open] summary::after { content: "▴"; }

.card { display: grid; gap: 10px; }
.bignum { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.name { font-family: var(--display); font-weight: 500; font-size: clamp(22px, 2.6vw, 28px); line-height: 1.15; text-wrap: balance; margin: 0; }
.prompt { font-size: 18px; font-weight: 600; margin: 0; text-wrap: balance; }
.fact { color: var(--muted); margin: 0; }
.type { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--c); }
.muted { color: var(--muted); }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { font: 500 15px var(--body); text-align: left; padding: 12px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.opt kbd { font: 600 11px var(--body); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt.good { border-color: var(--good); background: var(--good-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }

input[type="text"] { font: 500 17px var(--body); width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
input[type="text"]:focus { outline: none; border-color: var(--accent); }

.btn { font: 600 15px var(--body); padding: 11px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ok { background: var(--good); border-color: var(--good); color: #fff; }
.btn.no { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:hover { filter: brightness(1.05); }
.btn:focus-visible, .opt:focus-visible, .seg button:focus-visible, .tabs button:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns .btn { flex: 1 1 auto; }

.fb { border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.fb.good { background: var(--good-bg); }
.fb.bad { background: var(--bad-bg); }
.fb strong { font-size: 17px; }
.fb.good strong { color: var(--good); } .fb.bad strong { color: var(--bad); }

.score { display: flex; gap: 16px; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.score b { color: var(--ink); font-size: 16px; }
.bar { height: 6px; background: var(--chip); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

.progress { margin-top: 16px; display: grid; gap: 8px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.chip { font: 600 14px var(--body); font-variant-numeric: tabular-nums; aspect-ratio: 1; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; padding: 0; }
.chip.seen { border-color: var(--accent); color: var(--ink); }
.chip.learned { background: var(--good); border-color: var(--good); color: #fff; }
.linkbtn { font: 500 13px var(--body); background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }
.list { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 4px; }
.list li { display: flex; gap: 10px; }
.list b { min-width: 24px; color: var(--accent); font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); }
@media (hover: none) { .kb { display: none; } }
@media (max-width: 919px) {
  .wrap { padding-block: 10px 24px; }
  header { gap: 10px; margin-bottom: 10px; }
  h1 { font-size: 18px; } h1 small { display: none; }
  .mapsw { margin-bottom: 10px; } .mapsw button { flex: 1 1 0; padding: 8px 8px; font-size: 13px; }
  .tabs { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); }
  .tabs button { padding: 9px 4px; font-size: 13px; line-height: 1.2; }
  .app { gap: 12px; }
  .mscroll.zoomed { max-height: 48vh; }
  .panel { order: 2; } .progress { order: 3; margin-top: 4px; }
  .legend { font-size: 12px; gap: 4px 12px; margin-top: 6px; }
  .panel { padding: 14px; gap: 10px; }
  .bignum { font-size: 34px; }
  .prompt { font-size: 16px; }
  .name { font-size: 21px; }
  .opt { font-size: 14px; padding: 11px 10px; min-height: 48px; }
  .tag { font-size: 12px; padding: 4px 7px; transform: translate(-50%, calc(-100% - 16px)); }
  .fb { padding: 10px 12px; } .fb .fact { font-size: 14px; }
  .chips { grid-template-columns: repeat(7, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .marker.target::before { animation: none; } .bar i { transition: none; } }
</style>

<div class="wrap">
  <div class="mapsw" id="mapsw" role="group" aria-label="Карта"></div>
  <header>
    <h1><span id="title"></span><small id="subtitle"></small></h1>
    <div class="tabs" role="group" aria-label="Режим">
      <button id="tab-study" data-mode="study" aria-pressed="true">Учить</button>
      <button id="tab-quiz" data-mode="quiz" aria-pressed="false">Учитель показывает</button>
      <button id="tab-find" data-mode="find" aria-pressed="false">Найди на карте</button>
    </div>
  </header>

  <div class="app">
    <div class="stage">
      <div class="mapbox">
        <div class="mscroll" id="mscroll">
          <div class="map interactive" id="map">
            <img id="mapimg" src="" alt="">
          </div>
        </div>
        <button class="zoom" id="zoom" aria-pressed="false">Крупнее</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>
      <div class="progress">
        <div class="row" style="justify-content:space-between">
          <span class="label">Выучено: <span id="learned-count">0</span> из <span id="total-count">21</span></span>
          <button class="linkbtn" id="reset">Сбросить прогресс</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="hint">Зелёный — ответил правильно 2 раза подряд. Оранжевая рамка — уже отвечал.</div>
      </div>

    <section class="panel" id="panel-wrap">
      <details class="settings" id="settings">
        <summary><span class="label">Настройки</span><span class="hint" id="set-sum"></span></summary>
        <div class="row" id="style-row">
          <span class="label">Как отвечать</span>
          <div class="seg" id="style">
            <button id="st-oral" data-v="oral" aria-pressed="false">Устно</button>
            <button id="st-choice" data-v="choice" aria-pressed="true">Варианты</button>
            <button id="st-type" data-v="type" aria-pressed="false">Вписать</button>
          </div>
        </div>
        <div class="row">
          <span class="label">Что спрашивать</span>
          <div class="seg" id="filter"></div>
        </div>
      </details>
      <div id="panel"></div>
    </section>
  </div>
</div>

let M, W, H, TYPES, DATA, byN;

const $ = s => document.querySelector(s);
const map = $('#map'), panel = $('#panel');
let mode = 'study', style = 'choice', filter = 'all';
let queue = [], cur = null, total = 0, done = 0, missed = new Set(), locked = false, timer = null, lastPool = null;

/* ---------- progress (per viewer) ---------- */
let prog = {};
const progKey = () => M.id === 'islands' ? 'eu-geo-prog' : 'eu-geo-prog-' + M.id;
function loadProg() { try { prog = JSON.parse(localStorage.getItem(progKey()) || '{}') || {}; } catch (e) { prog = {}; } }
function saveProg() { try { localStorage.setItem(progKey(), JSON.stringify(prog)); } catch (e) {} }
function record(n, ok) {
  const p = prog[n] || { s: 0, seen: 0 };
  p.seen++; p.s = ok ? p.s + 1 : 0;
  prog[n] = p; saveProg(); renderChips();
}
function renderChips() {
  const box = $('#chips'); box.innerHTML = '';
  let learned = 0;
  DATA.forEach(d => {
    const p = prog[d.n];
    const b = document.createElement('button');
    b.className = 'chip';
    b.id = 'chip-' + d.n;
    b.textContent = d.n;
    b.title = mode === 'study' ? d.name : 'Номер ' + d.n;
    if (p && p.s >= 2) { b.classList.add('learned'); learned++; }
    else if (p && p.seen) b.classList.add('seen');
    b.onclick = () => { if (mode !== 'study') setMode('study'); showInfo(d.n); };
    box.appendChild(b);
  });
  $('#learned-count').textContent = learned;
  $('#total-count').textContent = DATA.length;
}
$('#reset').onclick = e => {
  const btn = e.currentTarget;
  if (btn.dataset.armed) { prog = {}; saveProg(); renderChips(); btn.textContent = 'Сбросить прогресс'; delete btn.dataset.armed; return; }
  btn.dataset.armed = '1'; btn.textContent = 'Точно сбросить? Нажми ещё раз';
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = 'Сбросить прогресс'; } }, 3000);
};

/* ---------- markers ---------- */
let markers = {};
function buildMarkers() {
map.querySelectorAll('.marker, .tag').forEach(x => x.remove());
markers = {};
DATA.forEach(d => {
  const b = document.createElement('button');
  b.className = 'marker';
  b.style.setProperty('--c', TYPES[d.t].c);
  b.id = 'm-' + d.n;
  b.style.left = (d.x / W * 100) + '%';
  b.style.top = (d.y / H * 100) + '%';
  b.setAttribute('aria-label', 'Номер ' + d.n);
  b.onclick = () => onMarker(d.n);
  map.appendChild(b);
  markers[d.n] = b;
});
}
function clearMap() {
  Object.values(markers).forEach(m => m.classList.remove('active', 'target', 'good', 'bad'));
  map.querySelectorAll('.tag').forEach(t => t.remove());
}
function tag(n, text, kind) {
  const d = byN[n], t = document.createElement('div');
  t.className = 'tag ' + (kind || 'dark');
  t.textContent = text;
  t.style.left = (d.x / W * 100) + '%';
  t.style.top = (d.y / H * 100) + '%';
  map.appendChild(t);
  // keep the label inside the map
  const mr = map.getBoundingClientRect(), r = t.getBoundingClientRect();
  const off = innerWidth < 920 ? 16 : 22;
  let dx = '-50%', dy = `calc(-100% - ${off}px)`;
  if (r.left < mr.left + 4) dx = `calc(-50% + ${mr.left + 4 - r.left}px)`;
  else if (r.right > mr.right - 4) dx = `calc(-50% - ${r.right - mr.right + 4}px)`;
  if (r.top < mr.top + 2) dy = off + 'px';
  if (dx !== '-50%' || dy !== `calc(-100% - ${off}px)`) t.style.transform = `translate(${dx}, ${dy})`;
}
function onMarker(n) {
  if (mode === 'study') showInfo(n);
  else if (mode === 'find' && cur && !locked) checkFind(n);
}

/* ---------- zoom & view ---------- */
const mscroll = $('#mscroll'), zoomBtn = $('#zoom');
zoomBtn.onclick = () => {
  const on = !mscroll.classList.contains('zoomed');
  mscroll.classList.toggle('zoomed', on);
  zoomBtn.setAttribute('aria-pressed', on);
  zoomBtn.textContent = on ? 'Вся карта' : 'Крупнее';
  map.querySelectorAll('.tag').forEach(t => t.remove());
  if (on) centerOn(cur ? cur.n : 13);
};
function centerOn(n) {
  if (!mscroll.classList.contains('zoomed')) return;
  const d = byN[n];
  mscroll.scrollTo({ left: d.x / W * map.offsetWidth - mscroll.clientWidth / 2, top: d.y / H * map.offsetHeight - mscroll.clientHeight / 2, behavior: 'smooth' });
}
function keepMapInView() {
  if (innerWidth >= 920) return;
  const r = mscroll.getBoundingClientRect();
  if (r.top < 0) scrollTo({ top: scrollY + r.top - 8, behavior: 'smooth' });
}
const STYLE_NAMES = { oral: 'Устно', choice: 'Варианты', type: 'Вписать' };
function updateSum() { $('#set-sum').textContent = (mode === 'quiz' ? STYLE_NAMES[style] + ' · ' : '') + (filter === 'all' ? 'Всё' : TYPES[filter].pl); }
if (innerWidth >= 920) $('#settings').open = true;

/* ---------- helpers ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const typeChip = d => `<span class="type" style="--c:${TYPES[d.t].c}"><i class="dot" style="--c:${TYPES[d.t].c}"></i>${TYPES[d.t].name}</span>`;
function norm(s) {
  return s.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z]+/g, ' ').split(' ')
    .filter(w => w && !/^(полу)?остров(а|ов)?$|^архипелаг$|^(море|моря|океан|залив|пролив|пр)$|^о$|^п$|^ов$|^о-в$/.test(w)).join(' ').trim();
}
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function dist(input, d) {
  return Math.min(...d.al.map(a => {
    let v = lev(input, a);
    if (input.length >= 6 && a.length >= 6) v = Math.min(v, lev(input.slice(0, 7), a.slice(0, 7)));
    return v;
  }));
}
// correct if the typed word is closest to the target (so «Исландия» never passes for «Ирландия») and within a small typo budget
function isRight(raw, target) {
  const s = norm(raw); if (!s) return false;
  const dt = dist(s, target);
  const lim = s.length >= 7 ? 2 : s.length >= 4 ? 1 : 0;
  if (dt > lim) return false;
  return DATA.every(o => o === target || dist(s, o) > dt);
}

/* ---------- modes ---------- */
function setMode(m) {
  mode = m; clearTimeout(timer);
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  $('#settings').hidden = m === 'study';
  $('#style-row').hidden = m !== 'quiz';
  map.classList.toggle('interactive', m !== 'quiz');
  renderChips();
  updateSum();
  clearMap();
  if (m === 'study') studyIntro();
  else startRound();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
function bindSeg(id, set) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute('aria-pressed', x === b));
    set(b.dataset.v); updateSum(); startRound();
  });
}
bindSeg('style', v => style = v);

/* ---------- study ---------- */
function studyIntro() {
  panel.innerHTML = `<div class="card">
    <p class="prompt">Нажимай на любую цифру на карте</p>
    <p class="fact">Появится название и подсказка, как запомнить. Когда пройдёшь все, переходи в режим «Учитель показывает»: там всё как на проверке.</p>
    <ul class="list">${DATA.map(d => `<li><b>${d.n}</b><span>${esc(d.name)}</span></li>`).join('')}</ul>
  </div>`;
}
function showInfo(n) {
  const d = byN[n];
  clearMap();
  markers[n].classList.add('active');
  tag(n, d.name);
  const prev = DATA[(DATA.indexOf(d) + DATA.length - 1) % DATA.length].n, next = DATA[(DATA.indexOf(d) + 1) % DATA.length].n;
  panel.innerHTML = `<div class="card">
    <div class="bignum">${d.n}</div>
    ${typeChip(d)}
    <h2 class="name">${esc(d.name)}</h2>
    <p class="fact">${esc(d.fact)}</p>
    <div class="btns"><button class="btn" id="prev">← ${prev}</button><button class="btn" id="next">${next} →</button></div>
    <button class="linkbtn" id="all" style="justify-self:start">Показать весь список</button>
  </div>`;
  $('#prev').onclick = () => showInfo(prev);
  $('#next').onclick = () => showInfo(next);
  $('#all').onclick = () => { clearMap(); studyIntro(); };
}

/* ---------- rounds ---------- */
function startRound(only) {
  if (mode === 'study') return;
  clearTimeout(timer);
  const pool = only || DATA.filter(d => filter === 'all' || d.t === filter).map(d => d.n);
  lastPool = pool;
  queue = shuffle(pool); total = queue.length; done = 0; missed = new Set();
  next();
}
function header() {
  const pct = total ? Math.round(done / total * 100) : 0;
  return `<div class="score"><span>Отгадано <b>${done}</b> из ${total}</span><span>Ошибок <b>${missed.size}</b></span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
}
function next() {
  clearTimeout(timer); clearMap(); locked = false;
  if (!queue.length) return finish();
  cur = byN[queue.shift()];
  mode === 'quiz' ? renderQuiz() : renderFind();
  if (mode === 'quiz') centerOn(cur.n);
  keepMapInView();
}
function resolve(ok, extra) {
  locked = true;
  record(cur.n, ok);
  if (ok) done++;
  else { missed.add(cur.n); queue.splice(Math.min(3, queue.length), 0, cur.n); }
  const fb = document.createElement('div');
  fb.className = 'fb ' + (ok ? 'good' : 'bad');
  fb.innerHTML = `<strong>${ok ? 'Верно!' : 'Неверно'} ${cur.n} — ${esc(cur.name)}</strong>${extra || ''}<span class="fact">${esc(cur.fact)}</span>`;
  $('#zone').replaceChildren(fb);
  const nb = document.createElement('button');
  nb.className = 'btn primary'; nb.id = 'nextq'; nb.innerHTML = 'Дальше <span class="kb">(Enter)</span>';
  nb.onclick = next;
  $('#zone').appendChild(nb);
  panel.querySelector('.score').outerHTML; // keep
  panel.querySelector('.bar i').style.width = Math.round(done / total * 100) + '%';
  panel.querySelector('.score').innerHTML = `<span>Отгадано <b>${done}</b> из ${total}</span><span>Ошибок <b>${missed.size}</b></span>`;
  if (ok) timer = setTimeout(next, 1400); else nb.focus({ preventScroll: true });
}

function renderQuiz() {
  markers[cur.n].classList.add('target');
  let body = '';
  if (style === 'choice') {
    const same = shuffle(DATA.filter(d => d !== cur && d.t === cur.t));
    const other = shuffle(DATA.filter(d => d !== cur && d.t !== cur.t));
    const opts = shuffle([cur, ...same.concat(other).slice(0, 3)]);
    body = `<div class="opts">${opts.map((d, i) => `<button class="opt" id="o${i}" data-n="${d.n}"><kbd class="kb">${i + 1}</kbd>${esc(d.name)}</button>`).join('')}</div>`;
  } else if (style === 'type') {
    body = `<form id="tf" class="card" autocomplete="off"><input type="text" id="answer" placeholder="Например: Сицилия" aria-label="Ответ">
      <div class="btns"><button class="btn primary" type="submit">Проверить</button><button class="btn" type="button" id="dunno">Не знаю</button></div>
      <span class="hint">Слова «остров» и «полуостров» можно не писать. Небольшие опечатки засчитываются.</span></form>`;
  } else {
    body = `<p class="fact">Скажи название вслух, как учителю. Потом открой ответ и честно отметь.</p>
      <button class="btn primary" id="reveal">Показать ответ <span class="kb">(пробел)</span></button>`;
  }
  panel.innerHTML = `${header()}<div class="card">
    <div class="row" style="gap:14px"><div class="bignum">${cur.n}</div>${typeChip(cur)}</div>
    <p class="prompt">Учитель показывает на цифру ${cur.n}. Что это?</p>
    <div id="zone" class="card">${body}</div></div>`;

  if (style === 'choice') {
    panel.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (locked) return;
      const n = +b.dataset.n, ok = n === cur.n;
      panel.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.n === cur.n) x.classList.add('good'); });
      markers[cur.n].classList.remove('target'); markers[cur.n].classList.add(ok ? 'good' : 'bad');
      tag(cur.n, cur.name, ok ? 'good' : 'bad');
      if (!ok) { b.classList.add('bad'); markers[n].classList.add('active'); tag(n, byN[n].name + ' — тут', 'dark'); }
      setTimeout(() => resolve(ok, ok ? '' : `<span>Ты выбрал «${esc(byN[n].name)}»: это номер ${n}, он подписан на карте.</span>`), ok ? 350 : 700);
    });
  } else if (style === 'type') {
    const inp = $('#answer'); inp.focus();
    $('#tf').onsubmit = e => {
      e.preventDefault(); if (locked || !inp.value.trim()) return;
      const ok = isRight(inp.value, cur);
      markers[cur.n].classList.remove('target'); markers[cur.n].classList.add(ok ? 'good' : 'bad');
      tag(cur.n, cur.name, ok ? 'good' : 'bad');
      resolve(ok, ok ? '' : `<span>Ты написал «${esc(inp.value.trim())}».</span>`);
    };
    $('#dunno').onclick = () => { markers[cur.n].classList.remove('target'); markers[cur.n].classList.add('bad'); tag(cur.n, cur.name, 'bad'); resolve(false); };
  } else {
    $('#reveal').onclick = () => {
      markers[cur.n].classList.remove('target'); markers[cur.n].classList.add('active'); tag(cur.n, cur.name);
      $('#zone').innerHTML = `<h2 class="name">${esc(cur.name)}</h2>
        <div class="btns"><button class="btn ok" id="knew">Знал <span class="kb">(1)</span></button><button class="btn no" id="didnt">Не знал <span class="kb">(2)</span></button></div>`;
      $('#knew').onclick = () => { if (!locked) { markers[cur.n].classList.add('good'); resolve(true); } };
      $('#didnt').onclick = () => { if (!locked) { markers[cur.n].classList.add('bad'); resolve(false); } };
      $('#knew').focus({ preventScroll: true });
    };
  }
}

function renderFind() {
  panel.innerHTML = `${header()}<div class="card">
    ${typeChip(cur)}
    <p class="prompt">Найди на карте и нажми на цифру:</p>
    <h2 class="name">${esc(cur.name)}</h2>
    <div id="zone" class="card"><span class="hint">Нажми на нужный кружок на карте.</span></div></div>`;
}
function checkFind(n) {
  const ok = n === cur.n;
  if (!ok) centerOn(cur.n);
  markers[cur.n].classList.add('good');
  tag(cur.n, cur.n + ' — ' + cur.name, 'good');
  if (!ok) { markers[n].classList.add('bad'); tag(n, n + ' — ' + byN[n].name, 'bad'); }
  resolve(ok, ok ? '' : `<span>Ты нажал на ${n}: это ${esc(byN[n].name)}. Правильно — ${cur.n}.</span>`);
}

function finish() {
  cur = null; clearMap();
  const clean = total - missed.size;
  const m = [...missed].sort((a, b) => a - b);
  const verdict = missed.size === 0 ? 'Без единой ошибки. Можно идти отвечать.' : missed.size <= 2 ? 'Почти идеально. Повтори ошибки ещё раз.' : 'Повтори ошибки, потом пройди заново.';
  panel.innerHTML = `<div class="card">
    <p class="label">Раунд закончен</p>
    <div class="bignum">${clean}/${total}</div>
    <p class="prompt">${verdict}</p>
    ${m.length ? `<p class="label">Ошибался тут</p><ul class="list">${m.map(n => `<li><b>${n}</b><span>${esc(byN[n].name)}</span></li>`).join('')}</ul>` : ''}
    <div class="btns">
      ${m.length ? `<button class="btn primary" id="redo">Повторить ошибки</button>` : ''}
      <button class="btn ${m.length ? '' : 'primary'}" id="again">Ещё раз всё</button>
    </div></div>`;
  if (m.length) $('#redo').onclick = () => startRound(m);
  $('#again').onclick = () => startRound();
  m.forEach(n => markers[n].classList.add('bad'));
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (mode === 'study' || e.target.tagName === 'INPUT' && !locked) return;
  if (locked && e.key === 'Enter') { e.preventDefault(); next(); return; }
  if (mode !== 'quiz' || locked) return;
  if (style === 'choice' && /^[1-4]$/.test(e.key)) { const b = $('#o' + (e.key - 1)); b && b.click(); }
  if (style === 'oral') {
    if (e.key === ' ' && $('#reveal')) { e.preventDefault(); $('#reveal').click(); }
    else if (e.key === '1' && $('#knew')) $('#knew').click();
    else if (e.key === '2' && $('#didnt')) $('#didnt').click();
  }
});

/* ---------- maps ---------- */
function switchMap(id) {
  M = MAPS[id] || MAPS.islands;
  W = M.w; H = M.h; TYPES = M.types; DATA = M.items;
  byN = Object.fromEntries(DATA.map(d => [d.n, d]));
  filter = 'all'; cur = null;
  try { localStorage.setItem('eu-geo-map', M.id); } catch (e) {}
  document.querySelectorAll('#mapsw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === M.id));
  $('#title').textContent = M.title;
  $('#subtitle').textContent = `Та же карта, что у учителя: ${DATA.length} номеров`;
  const img = $('#mapimg'); img.src = M.img; img.alt = `Спутниковая карта Европы с номерами 1–${DATA.length}`;
  map.style.aspectRatio = `${W} / ${H}`;
  $('#legend').innerHTML = Object.values(TYPES).map(t => `<span><i class="dot" style="--c:${t.c}"></i>${t.pl} ${t.range}</span>`).join('');
  $('#filter').innerHTML = `<button id="f-all" data-v="all" aria-pressed="true">Всё</button>` +
    Object.entries(TYPES).map(([k, t]) => `<button id="f-${k}" data-v="${k}" aria-pressed="false">${t.pl}</button>`).join('');
  bindSeg('filter', v => filter = v);
  buildMarkers(); loadProg();
  if (mscroll.classList.contains('zoomed')) zoomBtn.click();
  setMode(mode);
}
$('#mapsw').innerHTML = Object.values(MAPS).map(m => `<button id="map-${m.id}" data-id="${m.id}" aria-pressed="false">${m.short}</button>`).join('');
document.querySelectorAll('#mapsw button').forEach(b => b.onclick = () => { if (b.dataset.id !== M.id) switchMap(b.dataset.id); });
let startMap = location.hash.slice(1);
if (!MAPS[startMap]) { try { startMap = localStorage.getItem('eu-geo-map'); } catch (e) {} }
switchMap(startMap);
</script>
